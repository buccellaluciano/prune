# ───────────────────────────── Windows Update ─────────────────────────────
# La pausa y las horas activas no son tweaks: son fechas y horas, las maneja wupdate.rs.

[[tweak]]
id = "updates.no_drivers"
category = "updates"
title = "No instalar drivers desde Windows Update"
description = "Windows Update deja de bajar e instalar drivers por su cuenta, también los de dispositivos nuevos. Sirve si un driver de Windows Update te trajo problemas o preferís los del fabricante. Los drivers ya instalados no se tocan. Configuración va a decir que tu organización administra algunas opciones: es por esta directiva."
risk = "moderate"
tags = ["windows update", "drivers", "controladores", "actualizaciones"]
[[tweak.ops]]
hive = "HKLM"
path = 'SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
name = "ExcludeWUDriversInQualityUpdate"
kind = "dword"
on = 1
[[tweak.ops]]
hive = "HKLM"
path = 'SOFTWARE\Microsoft\Windows\CurrentVersion\DriverSearching'
name = "SearchOrderConfig"
kind = "dword"
on = 0
off = 1
