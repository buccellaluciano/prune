[[tweak]]
id = "appearance.faster_menus"
category = "appearance"
title = "Menús más rápidos"
description = "Baja la demora al abrir los submenús de 400 ms a 100 ms."
risk = "safe"
restart = "logoff"
tags = ["rendimiento"]
