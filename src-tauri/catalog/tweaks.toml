# Catálogo declarativo de tweaks.
#
# Cada tweak es un conjunto de operaciones de registro. "on" es el valor que
# aplica el tweak; "off" es el valor que lo revierte (si se omite, revertir
# BORRA el valor, devolviendo Windows a su comportamiento por defecto).
#
# Reglas:
#   - Nada de toggles a ciegas: el estado se calcula leyendo el registro real.
#   - kind = "dword" -> on/off enteros; kind = "sz" -> on/off strings.
#   - name = "" apunta al valor (Predeterminado) de la clave.
#   - delete_key_on_revert borra esa clave completa al revertir.
#   - Todo lo que esté bajo HKLM requiere ejecutar como administrador.

[[category]]
id = "privacy"
title = "Privacidad"
icon = "shield"

[[category]]
id = "ai"
title = "IA y Copilot"
icon = "sparkles"

[[category]]
