# Programas instalables con winget (fuente "winget" oficial de Microsoft).
#
# Criterios para entrar a la lista:
# - Proyecto mantenido y con publicador identificable (nada abandonado ni "repacks").
# - ID exacto del repositorio winget-pkgs: se instala con --exact, nunca por nombre.
# - Nada que se pueda conseguir mejor por Windows Update o la Store del sistema.
#
# Campos: id (PackageIdentifier), title, group, description.

[[group]]
id = "browsers"
title = "Navegadores"

[[group]]
id = "utilities"
title = "Utilidades"

[[group]]
id = "security"
title = "Contraseñas y seguridad"

[[group]]
id = "media"
title = "Multimedia"

[[group]]
id = "office"
title = "Documentos y notas"

[[group]]
id = "communication"
title = "Comunicación"

[[group]]
id = "dev"
title = "Desarrollo"

[[group]]
id = "gaming"
title = "Gaming"

