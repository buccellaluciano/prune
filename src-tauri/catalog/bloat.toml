# Catálogo de bloatware (paquetes Appx/MSIX).
#
# A diferencia del repo original, no se usan comodines amplios: se busca por
# nombre exacto de paquete (o un prefijo explícito de publisher), y SOLO se
# puede quitar lo que está en esta lista. Lo esencial (Store, App Installer /
# winget, Terminal, Calculadora, Seguridad de Windows, runtimes) nunca está acá.
#
# tier:
#   safe     -> nadie lo extraña
#   moderate -> puede que alguien lo use
#   advanced -> rompe funciones (juegos de Xbox, etc.); leer la nota

