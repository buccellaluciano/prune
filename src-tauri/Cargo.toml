[package]
name = "debloater"
version = "0.4.0"
description = "P-Rune: debloater y ajustes para Windows 11"
authors = ["buccellaluciano"]
license = "MIT"
repository = "https://github.com/buccellaluciano/prune"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "debloater_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56.0"
toml = "1.2.0"
thiserror = "2.0.21"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Management_Deployment", "ApplicationModel", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_NetworkManagement_NetManagement", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_RemoteDesktop", "Win32_System_Power", "Win32_System_Registry", "Win32_Networking_WinHttp", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Media_Audio", "Win32_System_SystemInformation", "Security_Credentials_UI", "Win32_System_WinRT", "Win32_Security_Credentials", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_Dns", "Win32_Networking_WinSock", "Win32_Networking_WinInet", "Win32_System_TaskScheduler", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Wmi", "Win32_System_Restore", "Win32_UI_Shell_Common", "Win32_System_Environment"] }
tauri-plugin-updater = "2"
windows-future = "0.3.2"
# Solo para descomprimir la release de WMO (ya venía con el plugin de actualizaciones).
zip = { version = "9.4.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
